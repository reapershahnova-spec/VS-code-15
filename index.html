<!DOCTYPE html>
<html>
<head>
    <title>My Birthday Checker</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <h1>My Birthday Checker</h1>

    <button onclick="checkBirthday()">Check Birthday</button>

    <div>Birthday: <span id="birthday"></span></div>
    <div>Days Left: <span id="days"></span></div>
    <div>Birthday Status: <span id="status"></span></div>
    <div>Message: <span id="message"></span></div>
    <div>Countdown: <span id="countdown"></span></div>
    <div>Birthday Gift: <span id="gift"></span></div>
    <div>Birthday Plan: <span id="plan"></span></div>

    <script src="script.js"></script>

</body>
</html>
